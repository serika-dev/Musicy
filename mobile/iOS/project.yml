name: Musicy
options:
  bundleIdPrefix: app.serika.musicy
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  MARKETING_VERSION: "1.6.0"
  CURRENT_PROJECT_VERSION: "${GITHUB_RUN_NUMBER}"
  SWIFT_VERSION: "5.0"
  # The shared singletons (player, library, sync) are main-actor by design;
  # complete checking would demand a much larger refactor than this app needs.
  SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Musicy:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Musicy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: "Background"
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: "Musicy-CarPlay"
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).CarPlaySceneDelegate"
    entitlements:
      path: Musicy.entitlements
