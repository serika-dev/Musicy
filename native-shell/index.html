<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>Musicy</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --fg: #f7f7fb;
        --muted: #a1a1aa;
        --primary: #7c3aed;
        --line: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 22% 18%, rgba(124, 58, 237, 0.28), transparent 32rem),
          linear-gradient(180deg, #111114 0%, var(--bg) 55%);
        color: var(--fg);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(32rem, calc(100% - 3rem));
        display: grid;
        gap: 1rem;
      }

      .mark {
        width: 4.5rem;
        height: 4.5rem;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 2rem 6rem rgba(0, 0, 0, 0.55);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 12vw, 4.75rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      a {
        width: fit-content;
        min-height: 2.75rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 1.1rem;
        border-radius: 0.5rem;
        background: var(--primary);
        color: white;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
          <path d="M9 18V5l11-2v13" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="6" cy="18" r="3" fill="white" />
          <circle cx="17" cy="16" r="3" fill="white" />
        </svg>
      </div>
      <h1>Musicy</h1>
      <p>
        The native shell is installed. Set <strong>MUSICY_NATIVE_URL</strong> when syncing Android to point this shell at
        your Musicy deployment or local Next server.
      </p>
      <a href="https://localhost">Open Musicy</a>
    </main>
  </body>
</html>
