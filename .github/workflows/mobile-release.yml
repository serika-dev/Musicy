name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag'
        required: true
      notes:
        description: 'Release notes'
        required: false

permissions:
  contents: write

jobs:
  android:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Both APKs are signed with the committed stable key, so either one can be
      # sideloaded and updated in place. Release is the one to hand out.
      - name: Build APKs
        working-directory: mobile/android
        run: gradle --no-daemon assembleRelease assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: musicy-android-${{ inputs.version }}
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: blacksmith-6vcpu-macos-latest
    steps:
      - uses: actions/checkout@v4

      - run: brew install xcodegen

      - working-directory: mobile/iOS
        run: xcodegen generate

      - working-directory: mobile/iOS
        run: |
          xcodebuild -scheme Musicy \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            clean build \
            CODE_SIGNING_ALLOWED=NO

      - uses: actions/upload-artifact@v4
        with:
          name: musicy-ios-${{ inputs.version }}
          path: mobile/iOS/DerivedData/Build/Products/Debug-iphonesimulator/Musicy.app
          if-no-files-found: error

  # Publish a real GitHub Release with the built binaries attached, so they are
  # not buried as run-only artifacts. Runs once both platforms build cleanly.
  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: musicy-android-${{ inputs.version }}
          path: android-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: musicy-ios-${{ inputs.version }}
          path: ios-app/Musicy.app

      - name: Package assets
        run: |
          mkdir -p dist
          cp android-artifacts/release/app-release.apk "dist/Musicy-${{ inputs.version }}.apk"
          cp android-artifacts/debug/app-debug.apk "dist/Musicy-${{ inputs.version }}-debug.apk"
          ( cd ios-app && zip -qr "../dist/Musicy-${{ inputs.version }}-iOS-simulator.zip" "Musicy.app" )
          ls -lh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="${{ inputs.notes }}"
          [ -z "$NOTES" ] && NOTES="Musicy Mobile ${{ inputs.version }}."
          gh release create "${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Musicy Mobile ${{ inputs.version }}" \
            --notes "$NOTES" \
            dist/*.apk dist/*.zip
