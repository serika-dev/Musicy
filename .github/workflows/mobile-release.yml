name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag'
        required: true
      notes:
        description: 'Release notes'
        required: false

permissions:
  contents: write

jobs:
  android:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # APKs (for sideloading) + AAB (for the Play Store). All signed with the
      # committed stable key, so the release APK updates in place. The repo is
      # open source, so the keystore living in-tree is intentional.
      - name: Build APKs and Play bundle
        working-directory: mobile/android
        run: gradle --no-daemon assembleRelease assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: musicy-android-${{ inputs.version }}
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    runs-on: blacksmith-6vcpu-macos-latest
    steps:
      - uses: actions/checkout@v4

      - run: brew install xcodegen

      - working-directory: mobile/iOS
        run: xcodegen generate

      - working-directory: mobile/iOS
        run: |
          xcodebuild -scheme Musicy \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            clean build \
            CODE_SIGNING_ALLOWED=NO

      - uses: actions/upload-artifact@v4
        with:
          name: musicy-ios-${{ inputs.version }}
          path: mobile/iOS/DerivedData/Build/Products/Debug-iphonesimulator/Musicy.app
          if-no-files-found: error

  # Publish a real GitHub Release with the built binaries attached, so they are
  # not buried as run-only artifacts. Runs once both platforms build cleanly.
  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: musicy-android-${{ inputs.version }}
          path: android-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: musicy-ios-${{ inputs.version }}
          path: ios-app/Musicy.app

      - name: Package assets
        run: |
          mkdir -p dist
          # upload-artifact@v4 strips the least-common-ancestor dir; with the AAB
          # added, that root is .../outputs, so APKs sit under apk/ in the artifact.
          # Resolve by name to stay robust to that layout shifting.
          find android-artifacts -name app-release.apk -exec cp {} "dist/Musicy-${{ inputs.version }}.apk" \;
          find android-artifacts -name app-debug.apk   -exec cp {} "dist/Musicy-${{ inputs.version }}-debug.apk" \;
          find android-artifacts -name app-release.aab -exec cp {} "dist/Musicy-${{ inputs.version }}.aab" \;
          ( cd ios-app && zip -qr "../dist/Musicy-${{ inputs.version }}-iOS-simulator.zip" "Musicy.app" )
          ls -lh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="${{ inputs.notes }}"
          [ -z "$NOTES" ] && NOTES="Musicy Mobile ${{ inputs.version }}."
          # Idempotent: create the release if it's new, otherwise (re-run of the
          # same version) just (re)upload the assets to the existing one.
          if gh release view "${{ inputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ inputs.version }}" \
              --repo "${{ github.repository }}" --clobber \
              dist/*.apk dist/*.aab dist/*.zip
          else
            gh release create "${{ inputs.version }}" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "Musicy Mobile ${{ inputs.version }}" \
              --notes "$NOTES" \
              dist/*.apk dist/*.aab dist/*.zip
          fi
